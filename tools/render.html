<!doctype html><html><body style="margin:0;background:#000"><canvas id=c></canvas>
<script type=module>
import * as THREE from 'three'
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js'
import {RIGS,buildArm} from '/src/three/kinematics.js'
import {loadPacked} from '/src/three/CobotScene.js'
const q=new URLSearchParams(location.search)
const rigName=q.get('rig'), view=q.get('view'), W=+q.get('w'), H=+q.get('h')
const rig=RIGS[rigName]
const r=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true})
r.setSize(W,H,false); r.setPixelRatio(1)
r.outputColorSpace=THREE.SRGBColorSpace; r.toneMapping=THREE.ACESFilmicToneMapping; r.toneMappingExposure=0.9
r.shadowMap.enabled=true; r.shadowMap.type=THREE.PCFSoftShadowMap
const s=new THREE.Scene(); s.background=new THREE.Color(0x000000)
const pm=new THREE.PMREMGenerator(r); s.environment=pm.fromScene(new RoomEnvironment(),0.04).texture; s.environmentIntensity=0.35
const geos=await loadPacked(`/models/${rigName}.bin`)
const body=new THREE.MeshStandardMaterial({color:q.get('color')?parseInt(q.get('color'),16):rig.body.dark,roughness:rig.body.roughness,metalness:rig.body.metalness})
const dark=new THREE.MeshStandardMaterial({color:0x17191d,roughness:0.42,metalness:0.3})
const {root,joints}=buildArm(rig,geos,rig.paint.map(p=>p==='dark'?dark:body))
const pose=q.get('angles')?q.get('angles').split(',').map(Number):rig.poses[q.get('pose')||'Ready'].slice(); if(q.get('j1')) pose[0]=+q.get('j1'); joints.forEach((j,i)=>j.rotation.z=(j.userData.sign||1)*pose[i]*Math.PI/180)
s.add(root); root.updateMatrixWorld(true)
const box=new THREE.Box3().setFromObject(root), size=box.getSize(new THREE.Vector3()), ctr=box.getCenter(new THREE.Vector3())
const Hh=size.y
// floor that catches a pool of light, fading into black
const floor=new THREE.Mesh(new THREE.CircleGeometry(Hh*4,96),new THREE.MeshStandardMaterial({color:0x0a0a0b,roughness:0.85,metalness:0,envMapIntensity:0}))
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; s.add(floor)
const spot=new THREE.SpotLight(0xffffff,26*Hh*Hh,0,0.42,1,1.4); spot.position.set(Hh*0.3,Hh*2.3,Hh*0.6); spot.target.position.set(ctr.x,0,ctr.z); s.add(spot,spot.target)
spot.castShadow=true; spot.shadow.mapSize.set(4096,4096); spot.shadow.radius=8; spot.shadow.bias=-0.0002; spot.shadow.camera.near=Hh*0.5; spot.shadow.camera.far=Hh*6
const rim=new THREE.DirectionalLight(0xa9c8ff,1.1); rim.position.set(-Hh*2,Hh*1.2,-Hh*2); s.add(rim)
const fill=new THREE.DirectionalLight(0xffffff,0.35); fill.position.set(Hh*2,Hh*0.6,Hh*1.5); s.add(fill)
const cam=new THREE.PerspectiveCamera(view==='detail'?22:26,W/H,0.01,100)
const dirs={hero:[1,0.42,1.25],side:[0.05,0.25,1],detail:[1,0.6,1.1],top:[0.9,1.2,0.9]}
const d=new THREE.Vector3(...dirs[view]).normalize()
let tgt=ctr.clone(), rad=Math.max(size.x,size.y,size.z)*0.74
if(view==='detail'){ const w=new THREE.Vector3(); joints[4].getWorldPosition(w); tgt=w; rad=Hh*0.27 }
const dist=rad/Math.sin(cam.fov*Math.PI/360)*(view==='detail'?1:1.0)
cam.position.copy(tgt).addScaledVector(d,dist); cam.lookAt(tgt)
s.fog=new THREE.Fog(0x000000,dist*0.85,dist*1.6)
floor.material.fog=true
r.render(s,cam); document.title='done'
</script></body></html>
